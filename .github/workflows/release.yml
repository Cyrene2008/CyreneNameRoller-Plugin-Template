name: Release plugin

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: pnpm run build
      - run: gh release create "$GITHUB_REF_NAME" dist/*.cnrp --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
